<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wan Mahadi - Pautan Utama</title>
    <!-- Media sosial icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000; /* Black Background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            padding: 40px 20px;
        }
        /* Profile Image */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #222;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255,255,255,0.05);
        }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Typography */
        h1 { 
            font-size: 1.5rem; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #ffffff; /* White text for black background */
            letter-spacing: -0.5px;
        }
        p.subtitle { 
            color: #00AAA5; /* Official PruBSN Teal Blue */
            margin-bottom: 25px; 
            font-size: 1.05rem; 
            font-weight: 700; 
        }

        /* Horizontal Social Icon Row */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 14px; 
            margin-bottom: 20px; 
        }
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: #1a1a1a; 
            color: #ffffff; 
            border-radius: 50%; 
            text-decoration: none;
            font-size: 1.3rem; 
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .social-icons a:hover {
            transform: scale(1.08);
            background-color: #333333;
        }

        /* Company Logo styling */
        .company-logo {
            width: 130px;
            height: auto;
            display: inline-block;
            margin: 10px 0 8px 0;
        }

        /* Tagline Styling */
        .tagline-group {
            margin-bottom: 30px; 
        }
        .tagline {
            font-style: italic;
            color: #a0aec0;
            font-size: 0.9rem;
            margin: 4px 0;
            font-weight: 500;
        }

        /* Linktree-style Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        /* Button 1: Links to quote.html */
        .btn-form {
            background-color: #00AAA5;
            color: #ffffff;
        }
        /* Button 2: WhatsApp */
        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Picture -->
        <div class="profile-img">
            <img src="profile.jpg" alt="Profil Wan Mahadi">
        </div>

        <!-- Name & Professional Title -->
        <h1>Wan Mahadi Wan Omar</h1>
        <p class="subtitle">Perunding Takaful Sepenuh Masa PruBSN</p>

        <!-- Circular Social Media Row -->
        <div class="social-icons">
            <a href="https://www.facebook.com/wanmahadiconsultancy" target="_blank" rel="noopener noreferrer" title="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/wanmahadiconsultancy/?hl=en" target="_blank" rel="noopener noreferrer" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.linkedin.com/in/wan-mahadi-wan-omar-403bb921/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://wa.me/60126560299" target="_blank" rel="noopener noreferrer" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>

        <!-- Company Logo -->
        <img src="logo.jpg" alt="Logo PruBSN Takaful" class="company-logo">

        <!-- Brand Taglines -->
        <div class="tagline-group">
            <div class="tagline">"Membantu Anda Melindungi Perkara Terpenting"</div>
            <div class="tagline">"Takaful Dipertuhkan Untuk Semua"</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="quote.html" class="btn btn-form">
                <i class="fa-regular fa-file-lines"></i> Minta Sebut Harga (Quotation)
            </a>
            <a href="https://wa.me/60126560299?text=Salam%20Wan%20Mahadi,%20saya%20ingin%20bertanya%20mengenai%20PruBSN%20Takaful." target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Hubungi Melalui WhatsApp
            </a>
        </div>
    </div>

</body>
</html>
